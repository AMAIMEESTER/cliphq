<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipHQ – doorsturen</title>
<style>
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; color: #17161a; background: #f6f5f2; }
  @media (prefers-color-scheme: dark) { body { color: #f1efeb; background: #121114; } }
  a.btn { display: inline-block; background: #ff4d2e; color: #fff; padding: 10px 16px; border-radius: 9px; text-decoration: none; font-weight: 600; }
  small { color: #8a8690; }
</style>
</head>
<body>
<h1>ClipHQ</h1>
<p id="msg">Dit is de doorstuurpagina van ClipHQ, een persoonlijk dashboard dat lokaal op de computer van de eigenaar draait.</p>
<p id="go" hidden><a class="btn" id="link" href="#">Ga verder naar ClipHQ</a><br><small>Gebeurt dit niet vanzelf? Zorg dat ClipHQ op je computer aan staat en klik op de knop.</small></p>
<p><small><a href="privacy.html">Privacy</a> · <a href="voorwaarden.html">Voorwaarden</a></small></p>
<script>
  // TikTok stuurt na het inloggen hierheen met ?code=…&state=…
  // Wij sturen dat meteen door naar ClipHQ op je eigen computer. Er wordt hier niets opgeslagen.
  var q = window.location.search;
  if (/[?&](code|error)=/.test(q)) {
    var target = "http://localhost:8000/tiktok/callback" + q;
    document.getElementById("msg").textContent = "Je wordt doorgestuurd naar ClipHQ op je computer…";
    document.getElementById("link").href = target;
    document.getElementById("go").hidden = false;
    window.location.replace(target);
  }
</script>
</body>
</html>
